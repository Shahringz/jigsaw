name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: github-pages

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: withastro/action@v6

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v5
        id: deployment

  verify-public-site:
    needs: deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Verify deployed revision in all three languages
        shell: bash
        run: |
          for language in fa en ar; do
            url="https://jigsawstudio.ir/$language/contact/?rev=$GITHUB_SHA"
            found=false
            for attempt in $(seq 1 12); do
              if curl -fsSL --max-time 20 "$url" | grep -F "content=\"$GITHUB_SHA\"" >/dev/null; then
                found=true
                echo "Confirmed $language $GITHUB_SHA"
                break
              fi
              sleep 10
            done
            if [ "$found" != true ]; then
              echo "::error::Live revision not confirmed for $language"
              exit 1
            fi
          done
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser test tools
        run: |
          npm ci
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps ${{ matrix.browser }}
      - name: Test published site at twelve viewport sizes
        env:
          SITE_URL: https://jigsawstudio.ir
          EXPECTED_RELEASE: ${{ github.sha }}
          BROWSER_ENGINE: ${{ matrix.browser }}
        run: node scripts/browser-smoke.mjs

  live-assets:
    needs: deploy
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify live favicon files and declarations
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: python3 scripts/verify-favicon.py
  safari:
    needs: live-assets
    permissions:
      contents: read
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Enable native Safari WebDriver
        run: sudo safaridriver --enable
      - name: Prepare Safari application
        run: |
          open -a Safari
          sleep 5
      - name: Open actual Safari and verify icon decoding
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          /usr/bin/safaridriver -p 4444 > /tmp/jigsaw-safari-driver.log 2>&1 &
          python3 scripts/safari-favicon.py
      - name: Driver diagnostics
        if: failure()
        run: cat /tmp/jigsaw-safari-driver.log || true
