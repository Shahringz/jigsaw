name: Safari favicon verification
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'public/icons/**'
      - 'src/components/SiteIcons.astro'
      - '.github/workflows/safari-favicon.yml'
      - 'scripts/verify-favicon.py'
      - 'scripts/safari-favicon.py'
permissions:
  contents: read
jobs:
  live-assets:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Verify live favicon files and declarations
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: python3 scripts/verify-favicon.py
  safari:
    needs: live-assets
    runs-on: macos-15
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Enable native Safari WebDriver
        run: sudo safaridriver --enable
      - name: Open actual Safari and verify icon decoding
        env:
          EXPECTED_RELEASE: ${{ github.sha }}
        run: |
          /usr/bin/safaridriver -p 4444 > /tmp/jigsaw-safari-driver.log 2>&1 &
          python3 scripts/safari-favicon.py
      - name: Driver diagnostics
        if: failure()
        run: cat /tmp/jigsaw-safari-driver.log || true
